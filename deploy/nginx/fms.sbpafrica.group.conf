# ==============================================================================
# SBP-FMS NGINX REVERSE PROXY CONFIGURATION
# Subdomain: fms.sbpafrica.group
# Backend Internal Binding: 127.0.0.1:8080
# ==============================================================================

upstream sbp_fms_backend {
    server 127.0.0.1:8080 fail_timeout=0;
    keepalive 32;
}

# HTTP server (port 80)
server {
    listen 80;
    listen [::]:80;
    server_name fms.sbpafrica.group;

    # Maximum payload size for file uploads (e.g. statement CSVs, receipts, bills)
    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Static Assets (collected via collectstatic)
    location /static/ {
        alias /home/sbpafrica/sbp_fms_django_backend/sbp_fms/staticfiles/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Media Uploads (invoices, receipts, statement files)
    location /media/ {
        alias /home/sbpafrica/sbp_fms_django_backend/sbp_fms/media/;
        expires 7d;
        access_log off;
        add_header Cache-Control "public, max-age=604800";
    }

    # Reverse proxy to Gunicorn backend on 127.0.0.1:8080
    location / {
        proxy_pass http://sbp_fms_backend;
        proxy_http_version 1.1;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # Pass through custom financial and webhook headers
        proxy_pass_request_headers on;

        # Timeouts for batch reconciliations and long-running financial processes
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
