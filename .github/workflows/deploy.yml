name: SBP-FMS CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------
  # 1. CI / TESTING STAGE
  # -------------------------------------------------------------
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv Package Manager
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install Dependencies
        run: |
          uv sync

      - name: Run Pytest Suite
        env:
          DEBUG: "1"
          SECRET_KEY: "ci-test-secret-key-at-least-50-characters-long-sbp-fms-2026"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
          DATABASE_URL: "sqlite://:memory:"
        run: |
          PYTHONPATH=sbp_fms uv run pytest sbp_fms

      - name: Validate OpenAPI 3.0 Schema
        env:
          DEBUG: "1"
          SECRET_KEY: "ci-test-secret-key-at-least-50-characters-long-sbp-fms-2026"
        run: |
          PYTHONPATH=sbp_fms uv run python sbp_fms/manage.py spectacular --file sbp_fms/schema.yml --validate

  # -------------------------------------------------------------
  # 2. CD / SSH PASSWORD DEPLOYMENT STAGE
  # -------------------------------------------------------------
  deploy:
    name: Deploy to Production via SSH (Password Auth)
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 30m
          script: |
            test -d /home/sbpafrica/sbp_fms_django_backend/.git || git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" /home/sbpafrica/sbp_fms_django_backend
            cd /home/sbpafrica/sbp_fms_django_backend
            git config --global --add safe.directory /home/sbpafrica/sbp_fms_django_backend
            git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            git fetch origin main || git fetch origin master
            git reset --hard origin/main || git reset --hard origin/master
            SSH_PASSWORD="${{ secrets.SSH_PASSWORD }}" bash deploy/scripts/deploy_production.sh
