components:
  schemas:
    APAgingReportOutput:
      type: object
      properties:
        country_code:
          type: string
        current_0_30_days:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,4})?$
        overdue_31_60_days:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,4})?$
        overdue_61_90_days:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,4})?$
        overdue_90_plus_days:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,4})?$
        total_payables:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,4})?$
      required:
      - country_code
      - current_0_30_days
      - overdue_31_60_days
      - overdue_61_90_days
      - overdue_90_plus_days
      - total_payables
    AccountCreateInputRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 20
        name:
          type: string
          minLength: 1
          maxLength: 255
        account_type:
          type: string
          minLength: 1
          maxLength: 20
        subtype:
          type: string
          default: ''
          maxLength: 50
        parent_id:
          type: string
          format: uuid
          nullable: true
        currency:
          type: string
          minLength: 1
          default: GHS
          maxLength: 3
        country_code:
          type: string
          minLength: 1
          default: GH
          maxLength: 2
        allow_direct_posting:
          type: boolean
          default: true
        opening_balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,4})?$
          default: '0.0000'
        opening_balance_date:
          type: string
          format: date
          nullable: true
        description:
          type: string
          default: ''
      required:
      - account_type
      - code
      - name
    AccountOutput:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          maxLength: 20
        name:
          type: string
          maxLength: 255
        account_type:
          $ref: '#/components/schemas/AccountTypeEnum'
        subtype:
          type: string
          maxLength: 50
        parent:
          type: string
          format: uuid
          nullable: true
        parent_code:
          type: string
          readOnly: true
        currency:
          type: string
          maxLength: 3
        country_code:
          type: string
          maxLength: 2
        is_active:
          type: boolean
        allow_direct_posting:
          type: boolean
        opening_balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,4})?$
        opening_balance_date:
          type: string
          format: date
          nullable: true
        description:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - account_type
      - code
      - created_at
      - id
      - name
      - parent_code
    AccountTypeEnum:
      enum:
      - ASSET
      - LIABILITY
      - EQUITY
      - REVENUE
      - DIRECT_COST
      - OPEX
      type: string
      description: |-
        * `ASSET` - Asset (1000-1999)
        * `LIABILITY` - Liability (2000-2999)
        * `EQUITY` - Equity (3000-3999)
        * `REVENUE` - Revenue (4000-4999)
        * `DIRECT_COST` - Direct Cost (5000-5999)
        * `OPEX` - Operating Expense (6000-6999)
    AccountUpdateInputRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        account_type:
          type: string
          minLength: 1
          maxLength: 20
        subtype:
          type: string
          minLength: 1
          maxLength: 50
        parent_id:
          type: string
          format: uuid
          nullable: true
        currency:
          type: string
          minLength: 1
          maxLength: 3
        country_code:
          type: string
          minLength: 1
          maxLength: 2
        is_active:
          type: boolean
        allow_direct_posting:
          type: boolean
        description:
          type: string
    AgingReportOutput:
      type: object
      properties:
        country_code:
          type: string
