      summary: Retrieve trial balance audit report
      parameters:
      - in: query
        name: country
        schema:
          type: string
        description: Filter by country code (e.g. GH, CI)
      - in: query
        name: date
        schema:
          type: string
        description: As of date (YYYY-MM-DD)
      tags:
      - Ledger - Reports Admin
      security:
      - jwtAuth: []
      - sbpTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
