              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/ledger/admin/entries/post/:
    post:
      operationId: admin_ledger_journal_entry_post
      description: Atomically creates and posts double-entry journal lines, verifying
        sum(debits) == sum(credits).
      summary: Post balanced journal entry
      tags:
      - Ledger - Journal Entries Admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JournalEntryCreateInput'
          application/x-www-form-urlencoded:
