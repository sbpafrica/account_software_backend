openapi: 3.0.3
info:
  title: SBP Africa Financial Management System (SBP-FMS) API
  version: 3.0.0
  description: Enterprise Double-Entry Accounting, Multi-Country Statutory Engine
    & RBAC API (Zero Django Admin)
paths:
  /api/v1/ledger/admin/accounts/:
    get:
      operationId: admin_ledger_account_list
      description: Returns list of Chart of Accounts with filters for country and
        account type.
      summary: List general ledger accounts
      parameters:
      - in: query
        name: country
        schema:
          type: string
        description: Two-letter country code (e.g. GH, CI)
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: type
        schema:
          type: string
        description: Account type filter (e.g. ASSET, LIABILITY)
      tags:
      - Ledger - Accounts Admin
      security:
      - jwtAuth: []
      - sbpTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAccountOutputList'
          description: ''
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/ledger/admin/accounts/{account_id}/:
    get:
      operationId: admin_ledger_account_detail
      summary: Retrieve account details
      parameters:
      - in: path
        name: account_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Ledger - Accounts Admin
      security:
      - jwtAuth: []
      - sbpTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Operation completed successfully.
                  data:
                    $ref: '#/components/schemas/AccountOutput'
                required:
                - success
                - message
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    put:
      operationId: admin_ledger_account_update
      summary: Update account details
      parameters:
      - in: path
        name: account_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Ledger - Accounts Admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdateInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccountUpdateInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccountUpdateInput'
      security:
      - jwtAuth: []
      - sbpTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Operation completed successfully.
                  data:
                    $ref: '#/components/schemas/AccountOutput'
                required:
                - success
                - message
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    patch:
      operationId: admin_ledger_account_partial_update
      summary: Partially update account details
      parameters:
      - in: path
        name: account_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Ledger - Accounts Admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAccountUpdateInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAccountUpdateInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAccountUpdateInput'
      security:
      - jwtAuth: []
      - sbpTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Operation completed successfully.
                  data:
                    $ref: '#/components/schemas/AccountOutput'
                required:
                - success
                - message
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    delete:
      operationId: admin_ledger_account_delete
      summary: Delete account
      parameters:
      - in: path
        name: account_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Ledger - Accounts Admin
      security:
      - jwtAuth: []
      - sbpTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Operation completed successfully.
                  data:
                    type: object
                    additionalProperties: {}
                required:
                - success
                - message
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/ledger/admin/accounts/create/:
    post:
      operationId: admin_ledger_account_create
      description: Creates a new Account in the Chart of Accounts.
      summary: Create new general ledger account
      tags:
      - Ledger - Accounts Admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreateInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccountCreateInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccountCreateInput'
        required: true
      security:
      - jwtAuth: []
      - sbpTokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Operation completed successfully.
                  data:
