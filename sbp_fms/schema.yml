openapi: 3.0.3
info:
  title: SBP Africa Financial Management System (SBP-FMS) API
  version: 3.0.0
  description: Enterprise Double-Entry Accounting, Multi-Country Statutory Engine
    & RBAC API (Zero Django Admin)
paths:
  /api/v1/assets/admin/assets/:
    get:
      operationId: admin_assets_list
      summary: List registered fixed assets
      parameters:
      - in: query
        name: category_id
        schema:
          type: string
        description: Filter by category UUID
      - in: query
        name: department
        schema:
          type: string
        description: Filter by department
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
        description: Filter by status (ACTIVE/DISPOSED/FULLY_DEPRECIATED)
      tags:
      - Fixed Assets - Register
      security:
      - jwtAuth: []
      - sbpTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFixedAssetOutputList'
          description: ''
    post:
      operationId: admin_assets_create
      summary: Register new fixed asset in register
      tags:
      - Fixed Assets - Register
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FixedAssetCreateInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FixedAssetCreateInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FixedAssetCreateInputRequest'
        required: true
      security:
      - jwtAuth: []
      - sbpTokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Operation completed successfully.
                  data:
                    $ref: '#/components/schemas/FixedAssetOutput'
                required:
                - success
                - message
          description: ''
  /api/v1/assets/admin/assets/{asset_id}/:
    get:
      operationId: admin_assets_detail
      description: Retrieve comprehensive fixed asset details, acquisition cost, accumulated
        depreciation, net book value, and lifecycle status.
      summary: Retrieve fixed asset details
      parameters:
      - in: path
        name: asset_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Fixed Assets - Register
      security:
      - jwtAuth: []
      - sbpTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Operation completed successfully.
                  data:
                    $ref: '#/components/schemas/FixedAssetOutput'
                required:
                - success
                - message
          description: ''
  /api/v1/assets/admin/assets/{asset_id}/dispose/:
    post:
      operationId: admin_assets_dispose
      summary: Dispose / Sell / Derecognize fixed asset and post GL entries
      parameters:
      - in: path
        name: asset_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Fixed Assets - Register
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FixedAssetDisposeInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FixedAssetDisposeInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FixedAssetDisposeInputRequest'
        required: true
      security:
      - jwtAuth: []
      - sbpTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Operation completed successfully.
                  data:
                    $ref: '#/components/schemas/FixedAssetOutput'
                required:
                - success
                - message
          description: ''
  /api/v1/assets/admin/assets/{asset_id}/schedule/:
    get:
      operationId: admin_assets_schedule
      summary: Retrieve depreciation schedule lines for an asset
      parameters:
      - in: path
        name: asset_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Fixed Assets - Register
      security:
      - jwtAuth: []
      - sbpTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Operation completed successfully.
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DepreciationScheduleLineOutput'
                required:
                - success
                - message
          description: ''
  /api/v1/assets/admin/categories/:
    get:
      operationId: admin_assets_category_list
      summary: List asset categories
      tags:
      - Fixed Assets - Categories
      security:
      - jwtAuth: []
      - sbpTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Operation completed successfully.
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AssetCategoryOutput'
                required:
                - success
                - message
          description: ''
    post:
      operationId: admin_assets_category_create
      summary: Create asset category
      tags:
      - Fixed Assets - Categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetCategoryCreateInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssetCategoryCreateInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssetCategoryCreateInputRequest'
        required: true
      security:
      - jwtAuth: []
      - sbpTokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Operation completed successfully.
                  data:
                    $ref: '#/components/schemas/AssetCategoryOutput'
                required:
                - success
                - message
          description: ''
  /api/v1/assets/admin/categories/{category_id}/:
    get:
      operationId: admin_assets_category_detail
      description: Fetch configuration details, useful life, depreciation method,
        and linked GL accounts for a specific asset category by UUID.
      summary: Retrieve asset category details
      parameters:
      - in: path
        name: category_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Fixed Assets - Categories
      security:
      - jwtAuth: []
      - sbpTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Operation completed successfully.
                  data:
                    $ref: '#/components/schemas/AssetCategoryOutput'
                required:
                - success
                - message
          description: ''
    put:
      operationId: admin_assets_category_update
      description: Update asset category attributes, useful life, depreciation method,
        or linked GL accounts.
      summary: Update asset category
      parameters:
      - in: path
        name: category_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Fixed Assets - Categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetCategoryUpdateInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssetCategoryUpdateInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssetCategoryUpdateInputRequest'
      security:
      - jwtAuth: []
      - sbpTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Operation completed successfully.
                  data:
                    $ref: '#/components/schemas/AssetCategoryOutput'
                required:
                - success
                - message
          description: ''
    patch:
      operationId: admin_assets_category_partial_update
      description: Partially update specific fields of an existing asset category.
      summary: Partially update asset category
      parameters:
      - in: path
        name: category_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Fixed Assets - Categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAssetCategoryUpdateInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAssetCategoryUpdateInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAssetCategoryUpdateInputRequest'
      security:
      - jwtAuth: []
      - sbpTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Operation completed successfully.
                  data:
                    $ref: '#/components/schemas/AssetCategoryOutput'
                required:
                - success
                - message
          description: ''
  /api/v1/assets/admin/depreciation-runs/:
    get:
      operationId: admin_assets_depreciation_run_list
      summary: List depreciation runs
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Fixed Assets - Depreciation
      security:
      - jwtAuth: []
      - sbpTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDepreciationRunOutputList'
          description: ''
    post:
      operationId: admin_assets_depreciation_run_calculate
      summary: Calculate draft depreciation run for period
      tags:
      - Fixed Assets - Depreciation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepreciationRunCalculateInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DepreciationRunCalculateInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DepreciationRunCalculateInputRequest'
        required: true
      security:
      - jwtAuth: []
      - sbpTokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Operation completed successfully.
                  data:
                    $ref: '#/components/schemas/DepreciationRunOutput'
                required:
                - success
                - message
          description: ''
  /api/v1/assets/admin/depreciation-runs/{run_id}/:
    get:
      operationId: admin_assets_depreciation_run_detail
      description: Retrieve calculation summary, asset count, total depreciation computed,
        and GL posting status of a depreciation run.
      summary: Retrieve depreciation run details
      parameters:
      - in: path
        name: run_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Fixed Assets - Depreciation
      security:
      - jwtAuth: []
      - sbpTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Operation completed successfully.
                  data:
                    $ref: '#/components/schemas/DepreciationRunOutput'
                required:
                - success
                - message
          description: ''
  /api/v1/assets/admin/depreciation-runs/{run_id}/post/:
    post:
      operationId: admin_assets_depreciation_run_post
      description: Post an approved draft depreciation run to General Ledger, generating
        balanced double-entry journal lines across asset categories.
      summary: Post depreciation run to General Ledger (DR Expense, CR Accumulated
        Depr)
      parameters:
      - in: path
        name: run_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Fixed Assets - Depreciation
      security:
      - jwtAuth: []
      - sbpTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Operation completed successfully.
                  data:
                    $ref: '#/components/schemas/DepreciationRunOutput'
                required:
                - success
                - message
          description: ''
  /api/v1/assets/admin/summary/:
    get:
      operationId: admin_assets_summary
      summary: Retrieve Asset Register financial summary metrics
      tags:
      - Fixed Assets - Summary
      security:
      - jwtAuth: []
      - sbpTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Operation completed successfully.
                  data:
                    $ref: '#/components/schemas/AssetRegisterSummaryOutput'
                required:
                - success
                - message
          description: ''
  /api/v1/budgeting/admin/budgets/:
    get:
      operationId: budgeting_admin_budgets_list
      summary: List budgets
      parameters:
      - in: query
        name: department
        schema:
          type: string
      - in: query
        name: financial_year
        schema:
          type: integer
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
      tags:
      - Budgeting & Commitments
      security:
      - jwtAuth: []
      - sbpTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBudgetOutputList'
          description: ''
    post:
      operationId: budgeting_admin_budgets_create
      summary: Create new budget
      tags:
      - Budgeting & Commitments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetCreateInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BudgetCreateInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BudgetCreateInputRequest'
        required: true
      security:
      - jwtAuth: []
      - sbpTokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Operation completed successfully.
                  data:
                    $ref: '#/components/schemas/BudgetOutput'
                required:
                - success
                - message
          description: ''
  /api/v1/budgeting/admin/budgets/{budget_id}/:
    get:
      operationId: budgeting_admin_budgets_retrieve
      summary: Get budget details
      parameters:
      - in: path
        name: budget_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Budgeting & Commitments
      security:
      - jwtAuth: []
      - sbpTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Operation completed successfully.
                  data:
                    $ref: '#/components/schemas/BudgetOutput'
                required:
                - success
                - message
          description: ''
  /api/v1/budgeting/admin/budgets/{budget_id}/approve/:
    post:
      operationId: budgeting_admin_budgets_approve_create
      description: Approves an active budget, establishing financial ceiling constraints
        for cost centres and departments.
      summary: Approve budget
      parameters:
      - in: path
        name: budget_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Budgeting & Commitments
      security:
      - jwtAuth: []
      - sbpTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Operation completed successfully.
                  data:
                    $ref: '#/components/schemas/BudgetOutput'
                required:
                - success
                - message
          description: ''
  /api/v1/budgeting/admin/budgets/{budget_id}/submit/:
    post:
      operationId: budgeting_admin_budgets_submit_create
      description: Submits a DRAFT budget to SUBMITTED status for financial management
        review.
      summary: Submit budget for approval
      parameters:
      - in: path
        name: budget_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Budgeting & Commitments
      security:
      - jwtAuth: []
      - sbpTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Operation completed successfully.
                  data:
                    $ref: '#/components/schemas/BudgetOutput'
                required:
                - success
                - message
          description: ''
  /api/v1/budgeting/admin/budgets/{budget_id}/variance/:
    get:
      operationId: budgeting_admin_budgets_variance_retrieve
      description: Generates three-way budget variance report comparing planned allocation
        against posted GL actuals and committed payment vouchers.
      summary: Get budget vs actuals vs commitments variance report
      parameters:
      - in: path
        name: budget_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Budgeting & Commitments
      security:
      - jwtAuth: []
      - sbpTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Operation completed successfully.
                  data:
                    $ref: '#/components/schemas/BudgetVarianceReportOutput'
                required:
                - success
                - message
          description: ''
  /api/v1/budgeting/admin/pre-commitment-check/:
    post:
      operationId: budgeting_admin_pre_commitment_check_create
      description: Intercepts purchase requisitions and payment vouchers to check
        if required funds exist within the approved budget line.
      summary: Execute pre-commitment budget availability check
      tags:
      - Budgeting & Commitments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreCommitmentCheckInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PreCommitmentCheckInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PreCommitmentCheckInputRequest'
        required: true
      security:
      - jwtAuth: []
      - sbpTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Operation completed successfully.
                  data:
                    $ref: '#/components/schemas/PreCommitmentCheckOutput'
                required:
                - success
                - message
          description: ''
  /api/v1/common/admin/attachments/:
    get:
      operationId: admin_common_attachment_list
      summary: List document attachments for a record
      parameters:
      - in: query
        name: module
        schema:
          type: string
        description: Module name (e.g. payables, receivables)
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: resource_id
        schema:
          type: string
        description: Record UUID
      tags:
      - Common - Document Vault
      security:
      - jwtAuth: []
      - sbpTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDocumentAttachmentOutputList'
          description: ''
    post:
      operationId: admin_common_attachment_create
      summary: Record uploaded document metadata
      tags:
      - Common - Document Vault
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentAttachmentCreateInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DocumentAttachmentCreateInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DocumentAttachmentCreateInputRequest'
        required: true
      security:
      - jwtAuth: []
      - sbpTokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Operation completed successfully.
                  data:
                    $ref: '#/components/schemas/DocumentAttachmentOutput'
                required:
                - success
                - message
          description: ''
  /api/v1/common/admin/attachments/{attachment_id}/:
    delete:
      operationId: admin_common_attachment_delete
      summary: Delete document attachment
      parameters:
      - in: path
        name: attachment_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Common - Document Vault
      security:
      - jwtAuth: []
      - sbpTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Operation completed successfully.
                  data:
                    type: object
                    additionalProperties: {}
                required:
                - success
                - message
          description: ''
  /api/v1/common/admin/audit-logs/:
    get:
      operationId: admin_common_audit_log_list
      summary: Retrieve immutable system audit log records
      parameters:
      - in: query
        name: action
        schema:
          type: string
        description: Filter by action (e.g. CREATE, POST, APPROVE)
      - in: query
        name: module
        schema:
          type: string
        description: Filter by module (e.g. ledger, payables, receivables, treasury)
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: resource_id
        schema:
          type: string
        description: Filter by resource UUID
      - in: query
        name: resource_type
        schema:
          type: string
        description: Filter by resource type (e.g. JournalEntry, PaymentVoucher)
      tags:
      - Common - Audit Log
      security:
      - jwtAuth: []
      - sbpTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogOutputList'
          description: ''
  /api/v1/consolidation/admin/rates/:
    get:
      operationId: consolidation_admin_rates_list
      summary: List exchange rates
      parameters:
      - in: query
        name: from_currency
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: rate_date
        schema:
          type: string
      - in: query
        name: to_currency
        schema:
          type: string
      tags:
      - Consolidation - Multi-Currency
