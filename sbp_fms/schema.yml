      properties:
        organization_name:
          type: string
          minLength: 1
          description: Official business or corporate trading entity name.
          maxLength: 200
        email:
          type: string
          format: email
          minLength: 1
          description: Owner/administrator corporate email address for platform authentication.
        password:
          type: string
          writeOnly: true
          minLength: 8
          description: Secure password for the administrator account (min 8 characters).
        first_name:
          type: string
          minLength: 1
          description: Administrator first name.
          maxLength: 150
        last_name:
          type: string
          minLength: 1
          description: Administrator last name.
          maxLength: 150
        country_code:
          type: string
          minLength: 1
          default: GH
          description: Two-letter ISO country code of headquarters (e.g. GH, NG, KE,
