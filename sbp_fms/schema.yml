        name: module
        schema:
          type: string
        description: Filter by source module (e.g. PAYROLL, REVERSAL)
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
        description: Filter by journal status (DRAFT, POSTED, REVERSED)
