      - permissions
      - user
    UserOutput:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        full_name:
          type: string
          readOnly: true
        role:
          type: string
          readOnly: true
        role_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        role_display:
          type: string
          readOnly: true
        assigned_country:
          type: string
          nullable: true
