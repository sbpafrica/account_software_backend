    PatchedSubscriptionPlanInputRequest:
      type: object
      description: Input payload for Superadmin creating or updating a dynamic subscription
        plan.
      properties:
        name:
          type: string
          minLength: 1
          description: Plan display name (e.g. Growth Tier Monthly)
          maxLength: 150
        code:
          type: string
          minLength: 1
          description: Optional unique slug code. Generated if omitted.
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
          default: ''
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Price in plan currency (e.g. 150.00)
        currency:
          type: string
          minLength: 1
          default: GHS
          description: Three-letter currency code (GHS, USD, NGN)
          maxLength: 3
        interval:
          allOf:
          - $ref: '#/components/schemas/BillingIntervalEnum'
          default: MONTHLY
          description: |-
            Billing recurrence interval (MONTHLY, ANNUALLY, ONETIME, FREE)

            * `MONTHLY` - Monthly
            * `ANNUALLY` - Annually
            * `ONETIME` - One-Time
            * `FREE` - Free
        trial_period_days:
          type: integer
          minimum: 0
          default: 0
          description: Trial days granted upon selection
        max_users:
          type: integer
          minimum: 1
          nullable: true
          description: Max team members allowed (null for unlimited)
        max_subsidiaries:
          type: integer
          minimum: 1
          default: 1
          description: Max legal subsidiary entities allowed
        features:
          type: array
          items:
            type: string
            minLength: 1
          description: List of feature codes or capabilities included
        is_active:
          type: boolean
          default: true
        is_public:
          type: boolean
          default: true
          description: Whether visible to public customers on pricing page
        sync_paystack:
          type: boolean
          default: true
          description: Sync plan creation with Paystack Plan API
