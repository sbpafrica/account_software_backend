components:
  schemas:
    AccountCreateInput:
      type: object
      properties:
        code:
          type: string
          maxLength: 20
        name:
          type: string
          maxLength: 255
        account_type:
          type: string
          maxLength: 20
        currency:
          type: string
          default: GHS
          maxLength: 3
        country_code:
          type: string
          default: GH
          maxLength: 2
        description:
          type: string
          default: ''
      required:
      - account_type
      - code
      - name
    AccountOutput:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          maxLength: 20
        name:
          type: string
          maxLength: 255
        account_type:
          $ref: '#/components/schemas/AccountTypeEnum'
        currency:
          type: string
          maxLength: 3
        country_code:
          type: string
          maxLength: 2
        is_active:
          type: boolean
        description:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - account_type
      - code
      - created_at
      - id
      - name
    AccountTypeEnum:
      enum:
      - ASSET
      - LIABILITY
      - EQUITY
      - REVENUE
      - DIRECT_COST
      - OPEX
      type: string
      description: |-
        * `ASSET` - Asset (1000-1999)
        * `LIABILITY` - Liability (2000-2999)
        * `EQUITY` - Equity (3000-3999)
        * `REVENUE` - Revenue (4000-4999)
        * `DIRECT_COST` - Direct Cost (5000-5999)
        * `OPEX` - Operating Expense (6000-6999)
    AccountUpdateInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
