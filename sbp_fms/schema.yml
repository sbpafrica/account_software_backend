  /api/v1/ledger/admin/entries/{entry_id}/reverse/:
    post:
      operationId: admin_ledger_journal_entry_reverse
      description: Generates inverse journal debit/credit lines and marks original
        as REVERSED.
      summary: Reverse posted journal entry
      parameters:
      - in: path
        name: entry_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Ledger - Journal Entries Admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JournalEntryReverseInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/JournalEntryReverseInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/JournalEntryReverseInput'
        required: true
      security:
      - jwtAuth: []
      - sbpTokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
