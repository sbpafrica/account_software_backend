      required:
      - effective_from
      - rate
      - tax_type
    TaxRuleOutput:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        country_code:
          type: string
          maxLength: 2
        tax_type:
          $ref: '#/components/schemas/TaxTypeEnum'
        bracket_min:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,4})?$
        bracket_max:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,4})?$
          nullable: true
        rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,4})?$
        effective_from:
          type: string
          format: date
      required:
      - country_code
      - created_at
      - effective_from
      - id
      - rate
      - tax_type
      - updated_at
    TaxRuleUpdateInput:
      type: object
      properties:
        country_code:
          type: string
          maxLength: 2
        tax_type:
          type: string
          maxLength: 20
        bracket_min:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,4})?$
        bracket_max:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,4})?$
          nullable: true
        rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,4})?$
        effective_from:
          type: string
          format: date
    TaxTypeEnum:
      enum:
      - PAYE
      - SSNIT
      - WHT
      - VAT
      type: string
      description: |-
        * `PAYE` - Personal Income Tax (PAYE)
        * `SSNIT` - Social Security / Pension
        * `WHT` - Withholding Tax
        * `VAT` - Value Added Tax
    ThreeWayMatchOutput:
      type: object
