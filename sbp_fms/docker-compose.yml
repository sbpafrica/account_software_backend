version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: sbp_fms_db
    environment:
      POSTGRES_DB: sbp_fms
      POSTGRES_USER: sbp_user
      POSTGRES_PASSWORD: sbp_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sbp_user -d sbp_fms"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sbp_fms_redis
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: sbp_fms_api
    command: gunicorn --bind 0.0.0.0:8000 --workers 4 --timeout 120 config.wsgi:application
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=0
      - ALLOWED_HOSTS=localhost,127.0.0.1,api
      - CORS_ALLOW_ALL_ORIGINS=0
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173
      - DATABASE_URL=postgres://sbp_user:sbp_secure_password_2026@db:5432/sbp_fms
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=prod-secret-key-change-this-in-live-deployments-89234891237
      - SECURE_SSL_REDIRECT=0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery_worker:
    build: .
    container_name: sbp_fms_celery_worker
    command: celery -A config worker --loglevel=info
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgres://sbp_user:sbp_secure_password_2026@db:5432/sbp_fms
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  celery_beat:
    build: .
    container_name: sbp_fms_celery_beat
    command: celery -A config beat --loglevel=info
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgres://sbp_user:sbp_secure_password_2026@db:5432/sbp_fms
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
